<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Tài khoản bị cấm · HalisAI</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="banned-icon">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>
      </div>
      <h1 class="auth-title">Tài khoản đã bị cấm</h1>
      {% if permanent %}
      <p class="auth-sub">Tài khoản của bạn bị cấm vĩnh viễn khỏi HalisAI.</p>
      {% else %}
      <p class="auth-sub">Tài khoản của bạn tạm thời không thể sử dụng HalisAI.</p>
      {% if let Some(u) = until %}<p class="banned-until">Đến: {{ u }}</p>{% endif %}
      {% endif %}
      {% if let Some(r) = reason %}<blockquote class="banned-reason">Lý do: {{ r }}</blockquote>{% endif %}
      <a class="btn-back" href="/">Thử lại</a>
    </div>
    <div class="auth-pagefoot">HalisAI</div>
  </div>
</body>
</html>
