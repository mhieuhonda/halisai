name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  COOLIFY: https://coolify.buppou.com
  SERVER_UUID: tmz98i9dob6oknig10yen6mr
  DB_UUID: 3oaacorrqezfzycu1rwoiog1

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ensure database is running
        if: env.COOLIFY_APP_UUID != ''
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          REACHABLE=$(curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY/api/v1/servers/$SERVER_UUID" | jq -r '.settings.is_reachable // false')
          if [ "$REACHABLE" != "true" ]; then
            echo "server unreachable, skipping db warm-up"
            exit 0
          fi
          for i in $(seq 1 12); do
            ST=$(curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY/api/v1/databases/$DB_UUID" | jq -r '.status // empty')
            echo "db status: $ST"
            case "$ST" in running*) exit 0 ;; esac
            curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY/api/v1/databases/$DB_UUID/start" >/dev/null || true
            sleep 10
          done
          echo "db not running yet, continuing anyway"

      - name: Trigger Coolify deploy
        if: env.COOLIFY_APP_UUID != ''
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          echo "Notifying Coolify..."
          curl -fsS -X POST \
            "$COOLIFY/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=true" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --retry 5 --retry-delay 10 --retry-all-errors
          echo
